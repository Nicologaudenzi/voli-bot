# Esegue il bot ogni 30 minuti sui server gratuiti di GitHub.
name: Voli sottoprezzo

on:
  schedule:
    - cron: "7,37 * * * *"     # ogni 30 minuti (minuti 7 e 37, meno traffico)
  workflow_dispatch: {}          # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: write                # serve per salvare database e immagini nel repository

concurrency:
  group: voli-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GITHUB_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cerca voli e invia offerte
        run: python -m bot.main

      - name: Salva storico prezzi e immagini
        run: |
          git config user.name "voli-bot"
          git config user.email "voli-bot@users.noreply.github.com"
          git add data posts
          git diff --cached --quiet || git commit -m "aggiornamento $(date -u +%F\ %H:%M)"
          git pull --rebase --autostash || true
          git push

      - name: Pubblica su Instagram
        run: python -m bot.publish
        continue-on-error: true

      - name: Salva stato pubblicazioni
        run: |
          git add data
          git diff --cached --quiet || (git commit -m "stato instagram" && git push)
